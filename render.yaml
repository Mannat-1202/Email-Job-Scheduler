services:
  # ─── Backend Web Service ───────────────────────────────────────────────────
  - type: web
    name: reachinbox-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate --schema=./src/db/schema.prisma && npm run build
    startCommand: npx prisma db push --schema=./src/db/schema.prisma && node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: reachinbox-redis
          type: redis
          property: connectionString
      - key: ELASTICSEARCH_URL
        value: ""
      - key: WORKER_CONCURRENCY
        value: "3"
      - key: MIN_DELAY_MS
        value: "2000"
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: "50"
      - key: JWT_SECRET
        generateValue: true
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://reachinbox-frontend.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_REDIRECT_URI
        value: https://reachinbox-backend.onrender.com/api/slack/oauth/callback
      - key: ETHEREAL_USER
        sync: false
      - key: ETHEREAL_PASS
        sync: false

  # ─── Frontend Web Service ──────────────────────────────────────────────────
  - type: web
    name: reachinbox-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://reachinbox-backend.onrender.com
      - key: NEXTAUTH_URL
        value: https://reachinbox-frontend.onrender.com
      - key: NEXTAUTH_SECRET
        fromService:
          name: reachinbox-backend
          type: web
          envVarKey: NEXTAUTH_SECRET
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  # ─── Redis ─────────────────────────────────────────────────────────────────
  - type: redis
    name: reachinbox-redis
    region: oregon
    plan: free
    maxmemoryPolicy: noeviction

# ─── PostgreSQL Database ────────────────────────────────────────────────────
databases:
  - name: reachinbox-postgres
    region: oregon
    plan: free
    databaseName: reachinbox_scheduler
    user: postgres
